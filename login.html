<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Waste Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eaf5eb;
            margin: 0;
            padding: 20px;
        }

        .login-box {
            background: white;
            max-width: 400px;
            margin: 60px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            text-align: center;
            color: #218838;
        }

        p {
            text-align: center;
            color: #555;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            background: #218838;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            line-height: 2;
        }

        a {
            color: #218838;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h1>♻️ Welcome Back!</h1>
        <p>Login to Smart Waste Management</p>

        <form id="loginForm">
            <label for="email">Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password"
                   placeholder="Enter your password" required>

            <button type="submit">Login</button>
        </form>

        <div class="links">
            <p>Don't have an account?</p>
            <a href="register.html">Create New Account</a>
            <br>
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

    <script>
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                alert("Login page design is ready. Backend authentication is not connected yet.");
            });
    </script>

</body>
</html>
